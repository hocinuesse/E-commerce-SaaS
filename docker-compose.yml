version: "3.8"

services:
  # -------------------------------------------------------------
  # 1. MongoDB Database
  # -------------------------------------------------------------
  mongo:
    image: mongo:7-jammy
    container_name: ecom_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecom_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Redis In-Memory Cache
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecom_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. Express + Node.js Backend API
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/ecomProject
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=23FD1YRMP6erjpCo3TtXHsvOyOH0xwIxYoS6gOFDBi8
      - JWT_REFRESH_SECRET=0eLVOMyIEBPFtJYNdd9qbfyEmij3xAIss8dCs7BwATo
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - SESSION_SECRET=9b1deb4d3b7d4f8de2839b2cf48d56a73c1d9b3a01d67e
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom_network

  # -------------------------------------------------------------
  # 4. Next.js 16 Frontend App
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecom_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api/v1
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - ecom_network

networks:
  ecom_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

